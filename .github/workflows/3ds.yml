name: 3DS-Port

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  rgbds_version: v1.0.1

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: |
          apt-get update
          apt-get install -yq bison libpng-dev pkg-config python3 build-essential git

      - name: rgbds bauen
        run: |
          git clone --depth 1 --branch ${{ env.rgbds_version }} https://github.com/gbdev/rgbds /tmp/rgbds
          make -C /tmp/rgbds -j$(nproc) install

      - name: makerom und bannertool bauen
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR /tmp/ctr
          make -C /tmp/ctr/makerom deps -j$(nproc)
          make -C /tmp/ctr/makerom -j$(nproc)
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          git clone --depth 1 --recursive https://github.com/diasurgical/bannertool /tmp/bannertool
          make -C /tmp/bannertool -j$(nproc)
          cp /tmp/bannertool/output/linux-x86_64/bannertool /usr/local/bin/

      - name: ROM bauen und pruefen
        run: |
          make -j$(nproc) red
          sha1sum -c roms.sha1 --ignore-missing

      - name: 3dsx und CIA bauen
        run: |
          make -C port3ds -j$(nproc) cia
          # Symboltabelle zum Auswerten von Absturzadressen (Luma-Crashdumps)
          $DEVKITARM/bin/arm-none-eabi-nm -n -C port3ds/3ds/pokered-de.elf > port3ds/pokered-de-symbole.txt

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pokered-de-3ds
          path: |
            port3ds/pokered-de.cia
            port3ds/3ds/pokered-de.3dsx
            port3ds/pokered-de-symbole.txt

  difftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: rgbds bauen
        run: |
          sudo apt-get update
          sudo apt-get install -yq bison libpng-dev pkg-config
          git clone --depth 1 --branch ${{ env.rgbds_version }} https://github.com/gbdev/rgbds /tmp/rgbds
          sudo make -C /tmp/rgbds -j$(nproc) install

      - name: Differenztest (Interpreter vs. Recompilat)
        run: |
          make -j$(nproc) red
          make -C port3ds -j$(nproc) difftest
